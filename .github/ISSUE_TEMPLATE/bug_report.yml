name: Bug Report
description: Report an issue or inconsistency in the MGP specification
labels: [bug]

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the issue clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should the specification state or imply?

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What does the specification currently state or imply?

  - type: textarea
    id: affected
    attributes:
      label: Affected RFCs or Documents
      description: List any impacted RFCs or files (e.g., RFC‑0003, mgp.md, docs/).
